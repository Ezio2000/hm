name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen pytest -q
      - run: uv build
